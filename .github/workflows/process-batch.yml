name: Process insta batch

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Batch id (must match batch["batch_id"])
        required: true
      message_id:
        description: Message id of the batch file in the group
        required: true

concurrency:
  group: insta-batch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Process batch
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          BATCH_CHAT_ID: ${{ secrets.BATCH_CHAT_ID }}
          IG_PROXY_URL: ${{ secrets.IG_PROXY_URL }}
          IG_COOKIE: ${{ secrets.IG_COOKIE }}
        run: python scripts/process_batch.py --batch-id "${{ inputs.batch_id }}" --message-id "${{ inputs.message_id }}"
